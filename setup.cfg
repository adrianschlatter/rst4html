[metadata]
name = rst4html
description = Variables and image transforms for ReST documents
long_description = file: docs/README.rst
long_description_content_type = text/markdown
url = https://github.com/adrianschlatter/rst4html/tree/master
project_urls =
    Bug Reports = https://github.com/adrianschlatter/rst4html/issues
    Source = https://github.com/adrianschlatter/rst4html
author = Adrian Schlatter
# Do *not* provide author_email here. Instead, provide email for
# software / licensing / ... questions (centrally) on GitHub.
# If email changes (e.g. discard because of too much spam),
# adjust email in single place instead of in every package.

license = BSD-3-Clause
license_files = LICENSE.txt

# See https://pypi.python.org/pypi?%3Aaction=list_classifiers
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Operating System :: OS Independent

keywords = python docutils restructuredtext rest

[options]
packages = find:
include_package_data = True
python_requires = >=3.5, <4
install_requires =
    docutils
    pillow
    importlib_metadata;python_version<='3.8'

[options.packages.find]
where = .

[options.extras_require]
# List additional groups of dependencies here. You can install these using:
# pip install -e .[dev,test]
test =
    check-manifest
    setuptools>=40.5.0
    flake8
    pytest
    pytest-cov
dev =
    build
    tox
    twine

[options.entry_points]
console_scripts =
    rst4html = rst4html.__cmdl__:main

[tool:pytest]
testpaths =
    tests
    docs
addopts =
    --cov=rst4html
    --cov-report=
    --cov-fail-under=100
    --doctest-glob=*.md

[flake8]
per-file-ignores =
    # imported but unused, import *, undefined name:
    __init__.py: F401, F403, F821
filename =
    */src/*.py
    */docs/*.py
    */tests/*.py
    setup.py

[check-manifest]
ignore =
    tox.ini
    tests
    tests/**
    docs/**
